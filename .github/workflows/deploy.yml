name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        env:
          REACT_APP_API_BASE_URL: http://${{ secrets.EC2_IP }}:4000
          DISABLE_ESLINT_PLUGIN: "true"
        run: |
          npm install --prefix web-tier --no-package-lock --include=dev --no-audit --no-fund
          npm run build --prefix web-tier
      - name: Deploy to EC2
        env:
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: bash deploy/ec2-deploy.sh
